<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>

<body>
    <ul class="languages">
        <li>JavaScript</li>
    </ul>
</body>

<script>

    // 🚩 first way: tree traversing
    function addLanguage(langName) {
        const li = document.createElement("li");
        // console.log(li)
        li.innerHTML = `${langName}`
        document.querySelector(".languages").appendChild(li)
    }
    addLanguage("Python")
    addLanguage("TypeScript")


    // 🚩 second way: optimized approach, recommended approach
    function addOptimizedLanguage(langName) {
        const li = document.createElement("li");
        li.appendChild(document.createTextNode(langName))
        document.querySelector(".languages").appendChild(li)
    }
    addOptimizedLanguage("goLang")


    // 🚩 Edit vlaues: example 1
    const secondLang = document.querySelector("li:nth-child(2)");
    // console.log(secondLang)
    const newLi = document.createElement("li");
    newLi.textContent = "Mojo"
    secondLang.replaceWith(newLi)


    // 🚩 Edit vlaues: example 2
    const firstLang = document.querySelector("li:first-child")
    // console.log(firstLang)
    firstLang.outerHTML = "<li>Java</li>"


    // 🚩 Remove:
    const lastLang = document.querySelector("li:last-child");
    // console.log(lastLang)
    lastLang.remove()
</script>

</html>
