<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        body {
            background-color: #212121;
            color: #fff;
        }

        .center {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        span{
            font-size: 20px;
        }
        #clock {
            font-size: 40px;
            color: #00FF00;
            background-color: #181818;
            padding: 20px 50px;
            margin-top: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="center">
        <span>Your local time</span>
        <div id="clock"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
